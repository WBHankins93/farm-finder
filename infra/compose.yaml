name: farmfinder

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmfinder}
      POSTGRES_USER: ${POSTGRES_USER:-farmfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmfinder_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/db/migrations:/docker-entrypoint-initdb.d:ro
      - ./verify.sql:/verify/verify.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

volumes:
  postgres-data:
