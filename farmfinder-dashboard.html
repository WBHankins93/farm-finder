  &lt;script&gt;
    (() =&gt; {

      };

      const pct = (value, total) =&gt; total ? Math.round(value / total * 100) : 0;
      const row = (label, value, total, secondary = false) =&gt; `&lt;div class=&quot;ff-row&quot;&gt;&lt;span class=&quot;ff-row-label&quot;&gt;${label}&lt;/span&gt;&lt;span class=&quot;ff-track&quot;&gt;&lt;span class=&quot;ff-fill${secondary ? &#x27; ff-fill-2&#x27; : &#x27;&#x27;}&quot; style=&quot;width:${pct(value,total)}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;strong class=&quot;ff-value&quot;&gt;${pct(value,total)}%&lt;/strong&gt;&lt;/div&gt;`;

        root.querySelector(&#x27;#ff-locations&#x27;).innerHTML = locations.map(([label,value]) =&gt; countRow(label,value,locationMax)).join(&#x27;&#x27;);

        root.querySelector(&#x27;#ff-score-low&#x27;).style.width = `${pct(d.score_low,d.farms)}%`;

        root.querySelector(&#x27;#ff-score-strong&#x27;).style.width = `${pct(d.score_strong,d.farms)}%`;
